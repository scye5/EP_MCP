[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agn-mcp"
version = "0.1.0"
description = "面向时域天文学的 AGN 判定 MCP 服务（方法论：Hickox & Alexander 2018）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
]

[project.optional-dependencies]
test = []   # 测试仅用标准库 unittest，无需 pytest

[project.scripts]
agn-mcp = "agn_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
